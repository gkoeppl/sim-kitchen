<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sim Kitchen</title>
<meta name="theme-color" content="#22314A">
<meta name="description" content="A gamified skill tree for learning to cook, together.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sim Kitchen">
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Karla:wght@400;500;600;700&display=swap');

:root{
  --paper:#EFE6C9;
  --card:#F8F1DC;
  --ink:#20302B;
  --ink-soft:#54655F;
  --sage:#4CAF2E;
  --sage-light:#DCEEDA;
  --mustard:#B9863F;
  --mustard-light:#EDDDB8;
  --tomato:#C2453B;
  --tomato-light:#F0D6D2;
  --locked:#AFC0BA;
  --line: rgba(32,48,43,0.18);
  --panel-teal:#42605D;
  --panel-teal-dark:#2E4644;
  --frame-navy:#22314A;
  --frame-navy-dark:#141C2B;
  --bevel-hi: rgba(255,255,255,0.4);
  --bevel-lo: rgba(0,0,0,0.35);
  --font-display: "Comic Sans MS", "Comic Neue", cursive;
  --font-body: 'Karla', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--frame-navy);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding:18px 14px;
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:28px 20px 80px;
  background:var(--paper);
  border-radius:12px;
  box-shadow: inset 2px 2px 0 var(--bevel-hi), inset -2px -2px 0 rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.45);
}

.title-bar{
  background:var(--frame-navy-dark);
  margin:-28px -20px 22px -20px;
  padding:11px 16px;
  border-radius:12px 12px 0 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.3);
}
.title-bar .tb-title{
  font-family:var(--font-display); font-weight:700; font-size:13px; color:#E7ECF3; letter-spacing:0.3px;
}
.title-bar .tb-dots{display:flex; gap:6px;}
.title-bar .tb-dots i{
  width:10px; height:10px; border-radius:3px; display:block;
  box-shadow: inset -1px -1px 0 rgba(0,0,0,0.3), inset 1px 1px 0 rgba(255,255,255,0.35);
}
.title-bar .tb-dots i:nth-child(1){background:var(--sage);}
.title-bar .tb-dots i:nth-child(2){background:var(--mustard);}
.title-bar .tb-dots i:nth-child(3){background:var(--tomato);}

/* Header */
.hero{margin-bottom:28px;}
.hero h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(26px,6vw,36px);
  margin:0 0 4px;
  letter-spacing:0;
  color:var(--panel-teal-dark);
  display:flex;
  align-items:center;
  gap:10px;
}
.hero h1::before{
  content:'';
  width:16px; height:16px;
  background:var(--sage);
  transform:rotate(45deg);
  border-radius:3px;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.5);
  flex-shrink:0;
}
.hero p.tag{
  margin:0 0 20px;
  color:var(--ink-soft);
  font-size:15px;
  max-width:46ch;
  line-height:1.5;
}

.status{
  background:var(--panel-teal);
  border-radius:10px;
  padding:16px 18px;
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  align-items:center;
  justify-content:space-between;
  box-shadow: inset 2px 2px 0 var(--bevel-hi), inset -2px -2px 0 var(--bevel-lo), 0 3px 6px rgba(0,0,0,0.2);
}
.status-block{min-width:160px;flex:1;}
.status-label{font-size:12px; color:#CFE0DC; margin:0 0 4px; font-weight:600;}
.status-value{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0; color:#FFFFFF;}
.xp-bar-track{
  height:12px; background:var(--panel-teal-dark); border-radius:3px; overflow:hidden; margin-top:8px;
  box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
  background-image: repeating-linear-gradient(90deg, transparent, transparent 18px, rgba(0,0,0,0.25) 18px, rgba(0,0,0,0.25) 19px);
}
.xp-bar-fill{
  height:100%; background: linear-gradient(180deg, #7CD957, var(--sage)); border-radius:2px; transition:width 0.5s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
}
.streak-value{font-family:var(--font-display); font-size:22px; font-weight:700; display:flex; align-items:center; gap:6px; color:#FFFFFF;}

/* Tabs */
.tabs{
  display:flex; gap:6px; margin:22px 0 24px; padding:6px;
  background:var(--panel-teal); border-radius:10px;
  box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo);
}
.tab-btn{
  font-family:var(--font-display); font-size:14px; font-weight:700; color:#DCEAE7;
  background:var(--panel-teal-dark); border:none; border-radius:6px; padding:9px 14px; cursor:pointer;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), inset -1px -1px 0 rgba(0,0,0,0.3);
  transition:transform 0.1s ease;
}
.tab-btn:hover{color:#FFFFFF;}
.tab-btn.active{
  background:var(--mustard); color:var(--ink);
  box-shadow: inset 2px 2px 4px rgba(0,0,0,0.35), inset -1px -1px 0 rgba(255,255,255,0.25);
}

.view{display:none;}
.view.active{display:block;}

/* Tier sections */
.tier{margin-bottom:34px;}
.tier-head{
  display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:2px solid var(--panel-teal); padding-bottom:8px; margin-bottom:14px;
}
.tier-head h2{font-family:var(--font-display); font-weight:700; font-size:19px; margin:0; color:var(--panel-teal-dark);}
.tier-head .tier-num{color:var(--mustard);}
.tier-progress{font-size:13px; color:var(--ink-soft); font-weight:600;}
.tier-lock-note{font-size:13.5px; color:var(--ink-soft); margin:-6px 0 14px; font-style:italic;}
.tier-horizon-note{font-size:13.5px; color:var(--ink-soft); margin:-6px 0 14px;}

.tier.just-unlocked{animation: revealTier 0.7s ease;}
@keyframes revealTier{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}

.recipe-card{
  background:var(--card); border-radius:6px; padding:14px 15px;
  display:flex; flex-direction:column; gap:8px; cursor:pointer;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.6), inset -1px -1px 0 rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.12);
  transition:transform 0.1s ease;
}
.recipe-card:hover{transform:translateY(-2px);}
.recipe-card.locked{opacity:0.5; cursor:default; filter:grayscale(0.4);}
.recipe-card.locked:hover{transform:none;}
.recipe-card h3{font-family:var(--font-display); font-size:16.5px; font-weight:600; margin:0; line-height:1.3;}
.recipe-card .desc{font-size:13.5px; color:var(--ink-soft); line-height:1.45; margin:0;}
.chip-row{display:flex; flex-wrap:wrap; gap:5px;}
.chip{font-size:11.5px; padding:2px 8px; border-radius:20px; color:var(--ink);}
.chip.tag-quick{background:var(--mustard-light);}
.chip.tag-family{background:var(--tomato-light);}
.chip.tag-freezer{background:var(--sage-light);}
.chip.tag-vegetarian{background:#E2E9E9;}
.chip.tag-side{background:#EDE3F0;}
.chip.tag-main{background:#DCE6EE;}
.chip.tag-airfryer{background:#D9E9F2; border:1px solid #A8C7DB;}

.filter-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:22px;}
.filter-chip{
  font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--ink-soft);
  background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 13px; cursor:pointer;
}
.filter-chip:hover{border-color:var(--ink-soft);}
.filter-chip.active{background:var(--sage); border-color:var(--sage); color:#FFFFFF;}
.filter-clear{
  font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--ink-soft); background:none;
  border:none; text-decoration:underline; cursor:pointer; padding:6px 2px;
}
.filter-empty-note{color:var(--ink-soft); font-size:13.5px; font-style:italic; padding:6px 0;}

.pin-btn{
  font-family:var(--font-body); font-weight:600; font-size:12px; color:var(--ink-soft); background:var(--card);
  border:1px solid var(--line); border-radius:6px; padding:6px 9px; cursor:pointer; white-space:nowrap;
}
.pin-btn:hover{border-color:var(--ink-soft); color:var(--ink);}
.pin-btn.pinned{background:var(--mustard-light); border-color:var(--mustard); color:var(--ink);}
.pin-btn-detail{margin-left:auto;}

.card-foot{display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:6px;}
.xp-tag{font-size:12.5px; color:var(--ink-soft); flex:1; font-weight:600;}
.cook-btn{
  font-family:var(--font-display); font-weight:700; font-size:13px; background:var(--sage); color:#FFFFFF;
  border:none; border-radius:6px; padding:7px 12px; cursor:pointer;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), inset -1px -1px 0 rgba(0,0,0,0.25);
}
.cook-btn:hover{background:#3F9424;}
.cook-btn.done{background:var(--sage-light); color:var(--sage); box-shadow:none;}
.lock-note{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;}


/* Log a meal view */
.panel{background:var(--card); border-radius:10px; padding:20px; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.6), inset -1px -1px 0 rgba(0,0,0,0.08);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
select, input[type=date], input[type=text], input[type=number], textarea{
  width:100%; font-family:var(--font-body); font-size:14.5px; padding:9px 10px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.12);
}
textarea{resize:vertical; min-height:60px;}
.rating-row{display:flex; gap:6px;}
.rating-star{font-size:22px; cursor:pointer; color:var(--locked); user-select:none;}
.rating-star.on{color:var(--mustard);}
.primary-btn{
  font-family:var(--font-display); font-weight:700; font-size:14.5px; background:var(--sage); color:#FFFFFF;
  border:none; border-radius:7px; padding:11px 18px; cursor:pointer;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), inset -1px -1px 0 rgba(0,0,0,0.25);
}
.primary-btn:hover{background:#3F9424;}
.primary-btn:disabled{background:var(--locked); cursor:not-allowed; box-shadow:none;}

.log-history{margin-top:26px;}
.log-history h2{font-family:var(--font-display); font-size:18px; font-weight:700; margin:0 0 12px; color:var(--panel-teal-dark);}
.log-entry{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.log-entry .le-name{font-weight:600;}
.log-entry .le-date{color:var(--ink-soft); white-space:nowrap;}
.empty-note{color:var(--ink-soft); font-size:13.5px; font-style:italic;}

/* Badges */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
.badge-card{
  background:var(--card); border-radius:8px; padding:14px; opacity:0.4; filter:grayscale(0.5);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5), inset -1px -1px 0 rgba(0,0,0,0.08);
}
.badge-card.earned{
  opacity:1; filter:none;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.6), inset -1px -1px 0 rgba(0,0,0,0.08), 0 0 0 2px var(--mustard);
}
.badge-card h3{font-family:var(--font-display); font-weight:700; font-size:15px; margin:0 0 4px; color:var(--panel-teal-dark);}
.badge-card p{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.4;}

/* Recipe detail view */
.back-link{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--panel-teal-dark); padding:0 0 18px;
}
.back-link:hover{color:var(--ink);}
.detail-head{margin-bottom:18px;}
.detail-head h2{font-family:var(--font-display); font-size:clamp(22px,5vw,28px); font-weight:700; margin:0 0 8px; color:var(--panel-teal-dark);}
.detail-meta{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; font-size:13px; color:var(--ink-soft); font-weight:600;}
.detail-meta .dot{opacity:0.5;}
.detail-desc{font-size:14.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 4px;}

.detail-grid{display:grid; grid-template-columns:1fr; gap:22px;}
@media(min-width:600px){ .detail-grid{grid-template-columns:1fr 1.4fr;} }

.detail-box{
  background:var(--card); border-radius:10px; padding:18px 20px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.6), inset -1px -1px 0 rgba(0,0,0,0.08);
}
.detail-box h3{
  font-family:var(--font-display); font-size:16px; font-weight:700; margin:0 0 12px; color:var(--panel-teal-dark);
  border-bottom:2px solid var(--paper); padding-bottom:8px;
}
.ingredient-list{list-style:none; margin:0; padding:0;}
.ingredient-list li{
  display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:6px 0;
  border-bottom:1px dotted var(--line);
}
.ingredient-list li:last-child{border-bottom:none;}
.ingredient-amt{color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}

.step-list{margin:0; padding:0; list-style:none; counter-reset:step;}
.step-list li{
  counter-increment:step; position:relative; padding:0 0 16px 34px; font-size:14.5px; line-height:1.55;
}
.step-list li:last-child{padding-bottom:0;}
.step-list li::before{
  content:counter(step); position:absolute; left:0; top:0; width:24px; height:24px; border-radius:50%;
  background:var(--sage); color:#FFFFFF; font-family:var(--font-display); font-weight:700;
  font-size:13px; display:flex; align-items:center; justify-content:center;
  box-shadow: inset -1px -1px 0 rgba(0,0,0,0.2);
}

.spice-tip-box{
  margin-top:16px; background:var(--sage-light); border-radius:8px; padding:12px 14px; font-size:13.5px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);
}
.spice-tip-box strong{display:block; margin-bottom:4px; font-family:var(--font-display); font-size:14px; color:var(--panel-teal-dark);}
.spice-tip-box p{margin:0; line-height:1.5; color:var(--ink);}

.mistakes-box{
  margin-top:16px; background:var(--tomato-light); border-radius:8px; padding:12px 14px; font-size:13.5px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);
}
.mistakes-box strong{display:block; margin-bottom:6px; font-family:var(--font-display); font-size:14px; color:var(--panel-teal-dark);}
.mistakes-box ul{margin:0; padding-left:18px;}
.mistakes-box li{margin-bottom:4px; line-height:1.5;}
.mistakes-box li:last-child{margin-bottom:0;}

.side-suggestion{
  margin-top:16px; background:var(--mustard-light); border-radius:8px; padding:12px 14px; font-size:13.5px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);
}
.side-suggestion strong{display:block; margin-bottom:6px; font-family:var(--font-display); font-size:14px; color:var(--panel-teal-dark);}
.side-link-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
.side-link-row:last-child{margin-bottom:0;}
.side-link{
  font-family:var(--font-body); font-weight:600; font-size:12.5px; background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-radius:20px; padding:5px 12px; cursor:pointer;
}
.side-link:hover{border-color:var(--ink-soft);}
.side-note{margin:0; color:var(--ink); line-height:1.5;}

.placeholder-note{
  background:var(--card); border:2px dashed var(--locked); border-radius:10px; padding:24px; text-align:center;
  color:var(--ink-soft); font-size:14px; line-height:1.6;
}

.detail-cook-btn{margin-top:20px;}


/* Toast */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel-teal-dark);
  color:#FFFFFF; padding:11px 18px; border-radius:8px; font-size:14px; font-weight:600; opacity:0;
  pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease; z-index:50; max-width:88vw; text-align:center;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), 0 4px 10px rgba(0,0,0,0.3);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .status{flex-direction:column; align-items:stretch;}
  body{padding:10px 6px;}
  .wrap{padding:24px 16px 70px;}
  .title-bar{margin:-24px -16px 20px -16px;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title-bar">
    <span class="tb-title">Sim Kitchen</span>
    <div class="tb-dots"><i></i><i></i><i></i></div>
  </div>

  <div class="hero">
    <h1>Sim Kitchen</h1>
    <p class="tag">From grilled cheese to a proper Sunday roast &mdash; a shared skill tree for two people learning to cook, one dish at a time.</p>
  </div>

  <div class="status">
    <div class="status-block">
      <p class="status-label" id="levelLabel">Level 1</p>
      <p class="status-value" id="xpValue">0 XP</p>
      <div class="xp-bar-track"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
    </div>
    <div class="status-block" style="flex:0 0 auto; text-align:right;">
      <p class="status-label">Streak</p>
      <p class="streak-value" id="streakValue">no streak yet</p>
    </div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" data-view="tree">Skill Tree</button>
    <button class="tab-btn" data-view="pinned">Pinned</button>
    <button class="tab-btn" data-view="log">Log a Meal</button>
    <button class="tab-btn" data-view="badges">Badges</button>
  </div>

  <div class="view active" id="view-tree"></div>

  <div class="view" id="view-pinned"></div>

  <div class="view" id="view-log">
    <div class="panel">
      <div class="field">
        <label for="logRecipe">Dish</label>
        <select id="logRecipe"></select>
      </div>
      <div class="field">
        <label for="logDate">Date</label>
        <input type="date" id="logDate">
      </div>
      <div class="field">
        <label>How'd it go? (optional)</label>
        <div class="rating-row" id="ratingRow">
          <span class="rating-star" data-val="1">&#9733;</span>
          <span class="rating-star" data-val="2">&#9733;</span>
          <span class="rating-star" data-val="3">&#9733;</span>
          <span class="rating-star" data-val="4">&#9733;</span>
          <span class="rating-star" data-val="5">&#9733;</span>
        </div>
      </div>
      <div class="field">
        <label for="logNotes">Notes (optional)</label>
        <textarea id="logNotes" placeholder="Too much salt, needs more garlic, wife loved it..."></textarea>
      </div>
      <button class="primary-btn" id="logSubmit">Log this meal</button>
    </div>

    <div class="log-history">
      <h2>History</h2>
      <div id="logHistoryList"></div>
    </div>
  </div>

  <div class="view" id="view-badges">
    <div class="badge-grid" id="badgeGrid"></div>
  </div>

  <div class="view" id="view-detail"></div>
</div>

<div class="toast" id="toast"></div>


<script>
const STORAGE_KEY = 'cookquest-data';

// Ingredient shorthand: [name, amount, unit]  — metric, sized for German grocery shopping (REWE/Edeka etc.)
const SEED_RECIPES = [
  // ---------- TIER 0 — Fundamentals ----------
  {
    id:'t0-1', tier:0, name:'Grilled Cheese Sandwich', desc:'Bread, butter, cheese, patience.', xp:10,
    tags:['quick','vegetarian'], servings:2, prepTime:'5 min', cookTime:'6 min',
    ingredients:[
      ['Bread','4','slices'],['Butter','30','g'],['Cheese slices (Gouda or cheddar)','120','g']
    ],
    steps:[
      'Butter one side of each slice of bread.',
      'Build two sandwiches with the cheese in the middle, buttered sides facing out.',
      'Heat a pan over medium heat and add the sandwiches.',
      'Cook 3–4 minutes per side, pressing gently, until golden and the cheese has melted.',
      'Slice diagonally and serve while hot.'
    ],
    mistakes:[

      const parsed = JSON.parse(raw);
      state.customRecipes = parsed.customRecipes || [];
      state.log = parsed.log || [];
      state.pinnedIds = parsed.pinnedIds || [];
      state.customRecipes.forEach(r => { if(!r.tags.includes('side') && !r.tags.includes('main')) r.tags.push('main'); });
    }
  }catch(e){ /* no existing data yet, or storage unavailable */ }
}

async function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Could not save progress', e); showToast('Couldn\u2019t save \u2014 try again in a moment'); }
}

function uniqueCookedIdsInTier(tierNum){
  const ids = new Set();
  state.log.forEach(entry => {
    const r = recipeById(entry.recipeId);
    if(r && r.tier === tierNum) ids.add(r.id);
  });
  return ids;
}

function isTierUnlocked(tierNum){
  if(tierNum === 0) return true;
  return uniqueCookedIdsInTier(tierNum - 1).size >= TIER_META[tierNum].unlockCount;
}

function totalXP(){ return state.log.reduce((sum, e) => sum + e.xpEarned, 0); }
function currentLevel(){ return 1 + Math.floor(totalXP() / 60); }
function xpProgressPct(){ const into = totalXP() % 60; return Math.min(100, Math.round((into / 60) * 100)); }

function computeStreak(){
  const dates = [...new Set(state.log.map(e => e.date))].sort().reverse();
  if(dates.length === 0) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const msDay = 86400000;
  const mostRecent = new Date(dates[0]);
  if(Math.round((today - mostRecent) / msDay) > 1) return 0;
  let streak = 1;
  for(let i=0; i<dates.length-1; i++){
    const diff = Math.round((new Date(dates[i]) - new Date(dates[i+1])) / msDay);
    if(diff === 1) streak++;
    else if(diff !== 0) break;
  }
  return streak;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function logMeal(recipeId, date, rating, notes){
  const recipe = recipeById(recipeId);
  if(!recipe) return;
  const alreadyCooked = state.log.some(e => e.recipeId === recipeId);
  const xpEarned = alreadyCooked ? Math.max(2, Math.round(recipe.xp / 3)) : recipe.xp;
  state.log.push({ recipeId, date, rating: rating || null, notes: notes || '', xpEarned, loggedAt: Date.now() });
  saveData();
  showToast(alreadyCooked
    ? `Logged \u201c${recipe.name}\u201d again \u2014 +${xpEarned} XP`
    : `First time cooking \u201c${recipe.name}\u201d \u2014 +${xpEarned} XP`);
  render();
}

function tagClass(tag){
  return {quick:'tag-quick', family:'tag-family', freezer:'tag-freezer', vegetarian:'tag-vegetarian', side:'tag-side', main:'tag-main', airfryer:'tag-airfryer'}[tag] || '';
}
function tagLabel(tag){
  if(tag === 'freezer') return 'freezer-friendly';
  if(tag === 'airfryer') return 'air fryer';
  return tag;
}

function togglePin(id){
  const idx = state.pinnedIds.indexOf(id);
  if(idx > -1){
    state.pinnedIds.splice(idx, 1);
  } else {
    if(state.pinnedIds.length >= 3){
      showToast('Unpin something first \u2014 max 3 at a time');
      return;
    }
    state.pinnedIds.push(id);
  }
  saveData();
  render();
}

function renderStatus(){
  document.getElementById('levelLabel').textContent = `Level ${currentLevel()}`;
  document.getElementById('xpValue').textContent = `${totalXP()} XP`;
  document.getElementById('xpBarFill').style.width = xpProgressPct() + '%';
  const streak = computeStreak();
  const streakEl = document.getElementById('streakValue');
  if(streak >= 2) streakEl.innerHTML = `${streak}-day streak &#128293;`;
  else if(streak === 1) streakEl.textContent = 'day one \u2014 keep going';
  else streakEl.textContent = 'no streak yet';
}

function renderFilterBar(){
  const bar = document.createElement('div');
  bar.className = 'filter-bar';
  ALL_FILTER_TAGS.forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (activeFilters.has(tag) ? ' active' : '');
    chip.textContent = tagLabel(tag);
    chip.addEventListener('click', () => {
      if(activeFilters.has(tag)) activeFilters.delete(tag); else activeFilters.add(tag);
      renderTree();
    });
    bar.appendChild(chip);
  });
  if(activeFilters.size > 0){
    const clear = document.createElement('button');
    clear.className = 'filter-clear';
    clear.textContent = 'Clear filters';
    clear.addEventListener('click', () => { activeFilters.clear(); renderTree(); });
    bar.appendChild(clear);
  }
  return bar;
}

function buildRecipeCard(r, unlocked, cooked){
  const card = document.createElement('div');
  card.className = 'recipe-card' + (unlocked ? '' : ' locked');
  const tagsHtml = r.tags.map(t => `<span class="chip ${tagClass(t)}">${tagLabel(t)}</span>`).join('');
  const isPinned = state.pinnedIds.includes(r.id);
  card.innerHTML = `
    <h3>${r.name}</h3>
    <p class="desc">${r.desc}</p>
    <div class="chip-row">${tagsHtml}</div>
    <div class="card-foot">
      <span class="xp-tag">${r.xp} XP</span>
      ${unlocked ? `<button class="pin-btn ${isPinned ? 'pinned' : ''}" data-pin="${r.id}">${isPinned ? '\u{1F4CC} Pinned' : '\u{1F4CC} Pin'}</button>` : ''}
      ${unlocked
        ? `<button class="cook-btn ${cooked ? 'done' : ''}" data-recipe="${r.id}">${cooked ? 'Cook again' : 'I cooked this'}</button>`
        : `<span class="lock-note">&#128274; locked</span>`}
    </div>
  `;
  if(unlocked){
    card.addEventListener('click', (e) => {
      if(e.target.closest('.cook-btn') || e.target.closest('.pin-btn')) return;
      openRecipeDetail(r.id);
    });
  }
  return card;
}

function renderTree(){
  const container = document.getElementById('view-tree');
  container.innerHTML = '';
  container.appendChild(renderFilterBar());

  let anyTierShown = false;

  TIER_META.forEach(meta => {
    const unlocked = isTierUnlocked(meta.n);
    const allTierRecipes = allRecipes().filter(r => r.tier === meta.n)
      .sort((a, b) => (a.tags.includes('side') ? 1 : 0) - (b.tags.includes('side') ? 1 : 0));
    const recipes = activeFilters.size === 0
      ? allTierRecipes
      : allTierRecipes.filter(r => [...activeFilters].every(tag => r.tags.includes(tag)));
    const cookedIds = uniqueCookedIdsInTier(meta.n);
    const hasDetails = allTierRecipes.some(r => r.steps);

    if(activeFilters.size > 0 && recipes.length === 0) return;
    anyTierShown = true;

    const tierDiv = document.createElement('div');
    tierDiv.className = 'tier';
    if(unlocked && !previouslyUnlockedTiers.has(meta.n)){
      tierDiv.classList.add('just-unlocked');
      previouslyUnlockedTiers.add(meta.n);
    }

    const head = document.createElement('div');
    head.className = 'tier-head';
    head.innerHTML = `<h2><span class="tier-num">Tier ${meta.n}</span> &mdash; ${meta.name}</h2>`;
    tierDiv.appendChild(head);

    if(!unlocked){
      const need = TIER_META[meta.n].unlockCount;
      const have = uniqueCookedIdsInTier(meta.n - 1).size;
      const note = document.createElement('p');
      note.className = 'tier-lock-note';
      note.textContent = `Unlocks after cooking ${need} different Tier ${meta.n - 1} dishes (${have}/${need} so far).`;
      tierDiv.appendChild(note);
    } else if(!hasDetails){
      const note = document.createElement('p');
      note.className = 'tier-horizon-note';
      note.textContent = 'On the horizon \u2014 full recipes for this tier are still being written.';
      tierDiv.appendChild(note);
    }

    const grid = document.createElement('div');
    grid.className = 'card-grid';

    recipes.forEach(r => {
      grid.appendChild(buildRecipeCard(r, unlocked, cookedIds.has(r.id)));
    });

    tierDiv.appendChild(grid);
    container.appendChild(tierDiv);
  });

  if(!anyTierShown){
    const note = document.createElement('p');
    note.className = 'filter-empty-note';
    note.textContent = 'Nothing matches that combination of filters.';
    container.appendChild(note);
  }

  container.querySelectorAll('.cook-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();

      logMeal(btn.dataset.recipe, todayStr(), null, '');
    });
  });
  container.querySelectorAll('.pin-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePin(btn.dataset.pin);
    });
  });
}

function renderLogView(){
  const select = document.getElementById('logRecipe');
  select.innerHTML = '';
  TIER_META.forEach(meta => {
    if(!isTierUnlocked(meta.n)) return;
    const group = document.createElement('optgroup');
    group.label = `Tier ${meta.n} \u2014 ${meta.name}`;
    allRecipes().filter(r => r.tier === meta.n).forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.id; opt.textContent = r.name;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
  document.getElementById('logDate').value = todayStr();

  const historyList = document.getElementById('logHistoryList');
  historyList.innerHTML = '';
  if(state.log.length === 0){
    historyList.innerHTML = '<p class="empty-note">Nothing logged yet \u2014 cook something and add it here.</p>';
    return;
  }
  [...state.log].sort((a,b) => b.loggedAt - a.loggedAt).forEach(entry => {
    const r = recipeById(entry.recipeId);
    if(!r) return;
    const row = document.createElement('div');
    row.className = 'log-entry';
    const stars = entry.rating ? '&#9733;'.repeat(entry.rating) : '';
    row.innerHTML = `<span class="le-name">${r.name}${stars ? ' &mdash; ' + stars : ''}</span><span class="le-date">${entry.date}</span>`;
    historyList.appendChild(row);
  });
}

const BADGE_DEFS = [
  {id:'first', name:'First Bite', desc:'Log your first meal.', test: () => state.log.length >= 1},
  {id:'tier1', name:'Building Blocks Unlocked', desc:'Unlock Tier 1.', test: () => isTierUnlocked(1)},
  {id:'tier2', name:'Real Cooking Unlocked', desc:'Unlock Tier 2.', test: () => isTierUnlocked(2)},
  {id:'tier3', name:'Centerpiece Unlocked', desc:'Unlock Tier 3.', test: () => isTierUnlocked(3)},
  {id:'streak3', name:'3-Day Streak', desc:'Cook three days in a row.', test: () => computeStreak() >= 3},
  {id:'streak7', name:'7-Day Streak', desc:'Cook seven days in a row.', test: () => computeStreak() >= 7},
  {id:'ten', name:'10 Meals Cooked', desc:'Log ten meals total.', test: () => state.log.length >= 10},
  {id:'twentyfive', name:'25 Meals Cooked', desc:'Log twenty-five meals total.', test: () => state.log.length >= 25},
  {id:'freezer', name:'Freezer Stockpiler', desc:'Cook three freezer-friendly dishes.', test: () => {
    const ids = new Set(state.log.map(e => e.recipeId));
    return [...ids].filter(id => recipeById(id) && recipeById(id).tags.includes('freezer')).length >= 3;
  }},
  {id:'family', name:'Family Table', desc:'Cook three family-friendly dishes.', test: () => {
    const ids = new Set(state.log.map(e => e.recipeId));
    return [...ids].filter(id => recipeById(id) && recipeById(id).tags.includes('family')).length >= 3;
  }},
  {id:'turkey', name:'Turkey Day', desc:'Cook the Thanksgiving-style turkey.', test: () => state.log.some(e => e.recipeId === 't3-5')},
];

function renderBadges(){
  const grid = document.getElementById('badgeGrid');
  grid.innerHTML = '';
  BADGE_DEFS.forEach(b => {
    const earned = b.test();
    const card = document.createElement('div');
    card.className = 'badge-card' + (earned ? ' earned' : '');
    card.innerHTML = `<h3>${earned ? '&#10003; ' : ''}${b.name}</h3><p>${b.desc}</p>`;
    grid.appendChild(card);
  });
}

function switchTab(view){
  activeTab = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.getElementById('mainTabs').style.display = 'flex';
}

function renderSideSuggestion(r){
  const validSideIds = (r.sideIds || []).filter(id => recipeById(id) && isTierUnlocked(recipeById(id).tier));
  if(validSideIds.length === 0 && !r.side) return '';
  const pillsHtml = validSideIds.length
    ? `<div class="side-link-row">${validSideIds.map(id => `<button class="side-link" data-recipe="${id}">${recipeById(id).name}</button>`).join('')}</div>`
    : '';
  const noteHtml = r.side ? `<p class="side-note">${r.side}</p>` : '';
  return `<div class="side-suggestion"><strong>Serve it with</strong>${pillsHtml}${noteHtml}</div>`;
}

function buildRecipeBodyHtml(r){
  if(r.steps && r.ingredients){
    const ingredientsHtml = r.ingredients.map(([name, amt, unit]) => {
      const amountText = amt ? `${amt}${unit && unit.length <= 3 ? ' ' + unit : ''}` : (unit || '');
      const nameText = (unit && unit.length > 3 && amt) ? `${name} (${unit})` : name;
      return `<li><span>${nameText}</span><span class="ingredient-amt">${amountText}</span></li>`;
    }).join('');
    const stepsHtml = r.steps.map(s => `<li>${s}</li>`).join('');
    const mistakesHtml = (r.mistakes && r.mistakes.length)
      ? `<div class="mistakes-box"><strong>Watch out for</strong><ul>${r.mistakes.map(m => `<li>${m}</li>`).join('')}</ul></div>`
      : '';
    const spiceTipHtml = r.spiceTip
      ? `<div class="spice-tip-box"><strong>Flavor idea</strong><p>${r.spiceTip}</p></div>`
      : '';
    return `
      <div class="detail-grid">
        <div class="detail-box">
          <h3>Ingredients</h3>
          <ul class="ingredient-list">${ingredientsHtml}</ul>
        </div>
        <div class="detail-box">
          <h3>Steps</h3>
          <ol class="step-list">${stepsHtml}</ol>
        </div>
      </div>
      ${mistakesHtml}
      ${spiceTipHtml}
      ${renderSideSuggestion(r)}
    `;
  }
  return `<div class="placeholder-note">This tier is still a way off \u2014 the full recipe for this one hasn\u2019t been written yet. It\u2019ll be here by the time you unlock it.</div>`;
}

function buildRecipeMetaHtml(r){
  const tagsHtml = r.tags.map(t => `<span class="chip ${tagClass(t)}">${tagLabel(t)}</span>`).join('');
  const metaBits = [];
  if(r.servings) metaBits.push(`Serves ${r.servings}`);
  if(r.prepTime) metaBits.push(`Prep ${r.prepTime}`);
  if(r.cookTime) metaBits.push(`Cook ${r.cookTime}`);
  const metaHtml = metaBits.join(' <span class="dot">&middot;</span> ');
  return { tagsHtml, metaHtml };
}

function openRecipeDetail(id){
  const r = recipeById(id);
  if(!r) return;
  const container = document.getElementById('view-detail');
  const cooked = state.log.some(e => e.recipeId === id);
  const isPinned = state.pinnedIds.includes(id);

  const { tagsHtml, metaHtml } = buildRecipeMetaHtml(r);
  const bodyHtml = buildRecipeBodyHtml(r);

  container.innerHTML = `
    <button class="back-link" id="detailBackBtn">&larr; Back to Skill Tree</button>
    <div class="detail-head">
      <h2>${r.name}</h2>
      ${metaHtml ? `<div class="detail-meta">${metaHtml}</div>` : ''}
      <p class="detail-desc">${r.desc}</p>
      <div class="chip-row">${tagsHtml}</div>
    </div>
    ${bodyHtml}
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="primary-btn" id="detailCookBtn">${cooked ? 'Cook again' : 'I cooked this'}</button>
      <button class="pin-btn ${isPinned ? 'pinned' : ''}" id="detailPinBtn">${isPinned ? '\u{1F4CC} Pinned' : '\u{1F4CC} Pin'}</button>
    </div>
  `;

  document.getElementById('detailBackBtn').addEventListener('click', () => {
    document.getElementById('mainTabs').style.display = 'flex';
    switchTab('tree');
  });
  document.getElementById('detailCookBtn').addEventListener('click', () => {
    logMeal(id, todayStr(), null, '');
    openRecipeDetail(id);
  });
  document.getElementById('detailPinBtn').addEventListener('click', () => {
    togglePin(id);
    openRecipeDetail(id);
  });
  container.querySelectorAll('.side-link').forEach(btn => {
    btn.addEventListener('click', () => openRecipeDetail(btn.dataset.recipe));
  });

  document.getElementById('mainTabs').style.display = 'none';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  container.classList.add('active');
}

function renderPinned(){
  const container = document.getElementById('view-pinned');
  container.innerHTML = '';

  if(state.pinnedIds.length === 0){
    container.innerHTML = '<p class="empty-note">Nothing pinned yet \u2014 pin a main and a couple of sides before you start cooking, and they\u2019ll all sit here together while you work.</p>';
    return;
  }

  state.pinnedIds.forEach(id => {
    const r = recipeById(id);
    if(!r) return;
    const cooked = state.log.some(e => e.recipeId === id);
    const { tagsHtml, metaHtml } = buildRecipeMetaHtml(r);
    const bodyHtml = buildRecipeBodyHtml(r);

    const block = document.createElement('div');
    block.style.marginBottom = '30px';
    block.innerHTML = `
      <div class="detail-head">
        <h2>${r.name}</h2>
        ${metaHtml ? `<div class="detail-meta">${metaHtml}</div>` : ''}
        <div class="chip-row">${tagsHtml}</div>
      </div>
      ${bodyHtml}
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="primary-btn" data-cook="${id}">${cooked ? 'Cook again' : 'I cooked this'}</button>
        <button class="pin-btn pinned" data-unpin="${id}">\u{1F4CC} Unpin</button>
      </div>
    `;
    container.appendChild(block);
  });

  container.querySelectorAll('[data-cook]').forEach(btn => {
    btn.addEventListener('click', () => logMeal(btn.dataset.cook, todayStr(), null, ''));
  });
  container.querySelectorAll('[data-unpin]').forEach(btn => {
    btn.addEventListener('click', () => togglePin(btn.dataset.unpin));
  });
  container.querySelectorAll('.side-link').forEach(btn => {
    btn.addEventListener('click', () => {
      switchTab('tree');
      openRecipeDetail(btn.dataset.recipe);
    });
  });
}

function render(){
  renderStatus();
  renderTabLabels();
  renderTree();
  renderPinned();
  renderLogView();
  renderBadges();
}

function renderTabLabels(){
  const pinnedTab = document.querySelector('.tab-btn[data-view="pinned"]');
  pinnedTab.textContent = state.pinnedIds.length > 0 ? `Pinned (${state.pinnedIds.length})` : 'Pinned';
}

function setupTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.view));
  });
}

function setupLogForm(){
  document.querySelectorAll('.rating-star').forEach(star => {
    star.addEventListener('click', () => {
      selectedRating = parseInt(star.dataset.val);
      document.querySelectorAll('.rating-star').forEach(s => s.classList.toggle('on', parseInt(s.dataset.val) <= selectedRating));
    });
  });
  document.getElementById('logSubmit').addEventListener('click', () => {
    const recipeId = document.getElementById('logRecipe').value;
    const date = document.getElementById('logDate').value || todayStr();
    const notes = document.getElementById('logNotes').value;
    if(!recipeId) return;
    logMeal(recipeId, date, selectedRating, notes);
    document.getElementById('logNotes').value = '';
    selectedRating = 0;
    document.querySelectorAll('.rating-star').forEach(s => s.classList.remove('on'));
  });
}

async function init(){
  await loadData();
  TIER_META.forEach(m => { if(isTierUnlocked(m.n)) previouslyUnlockedTiers.add(m.n); });
  setupTabs();
  setupLogForm();
  render();
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('Service worker registration failed:', err));
  });
}
</script>
</body>
